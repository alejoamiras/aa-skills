name: setup-bun
description: Bun at the one version every workflow here runs.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/fetch-tool
      with:
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip
        sha256: 36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913
        binary: bun-linux-x64/bun
