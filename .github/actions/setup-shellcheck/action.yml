name: setup-shellcheck
description: ShellCheck 0.11.0 from its release, checksum-verified, ahead of the runner image's own on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
        SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      run: |
        d="$RUNNER_TEMP/shellcheck"
        mkdir -p "$d"
        curl -fsSL --retry 3 -o "$d/shellcheck.tar.xz" "$URL"
        echo "$SHA256  $d/shellcheck.tar.xz" | sha256sum -c -
        tar -xJf "$d/shellcheck.tar.xz" -C "$d" --strip-components=1
        echo "$d" >> "$GITHUB_PATH"
        "$d/shellcheck" --version
