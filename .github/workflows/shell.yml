name: shell

on:
  workflow_dispatch:
  pull_request: # no branches: filter: a stacked PR targets its parent branch, not main

permissions:
  contents: read

# tests/smoke-memo-guard.sh: it tests the private claude/ submodule, which CI cannot clone.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          # checks/budget.ts finds shell files by shebang as well as by name, so a change to any path may be one.
          filters: |
            relevant:
              - '**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  shellcheck:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - uses: ./.github/actions/setup-shellcheck
      - run: checks/shellcheck.sh

  budget:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: bun test tests/budget.test.ts
      # A pull_request checkout is the merge commit, whose first parent is the base branch's head.
      - if: github.event_name == 'pull_request'
        run: bun checks/budget.ts --base HEAD^1
      - if: github.event_name != 'pull_request'
        run: bun checks/budget.ts
      - run: checks/wired.sh

  shell-status:
    needs: [changes, shellcheck, budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail when a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
